services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aquatwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: aquatwin
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - aquatwin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquatwin -d aquatwin"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  aquatwin_pg:
