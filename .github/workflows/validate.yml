name: AquaTwin validation
on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**"]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aquatwin
          POSTGRES_PASSWORD: ci-test-password-only
          POSTGRES_DB: aquatwin_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aquatwin -d aquatwin_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://aquatwin:ci-test-password-only@127.0.0.1:5432/aquatwin_test_ci
      E2E_DATABASE_URL: postgresql://aquatwin:ci-test-password-only@127.0.0.1:5432/aquatwin_test_ci_e2e
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Create isolated E2E database
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['TEST_DATABASE_URL'], autocommit=True) as conn:
              conn.execute('CREATE DATABASE aquatwin_test_ci_e2e')
          PY
      - name: Unit, build, PostgreSQL and browser checks
        run: python scripts/verify.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            test-results/
            validation-logs/
          retention-days: 7
